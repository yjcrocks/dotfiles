- defaults:
    link:
        relink: true

- clean: ['~']

- link:
    ~/.gitconfig: gitconfig
    ~/.gitignore: gitignore
    ~/.vim: vim/
    ~/.vimrc: vimrc
    ~/.zsh: zsh/
    ~/.zshenv: zshenv
    ~/.zshrc: zshrc
    ~/.zlogin: zlogin
    ~/.zimrc: zimrc
    ~/.tmux.conf: tmux.conf
    ~/.config/mise/config.toml:
        create: true
        path: mise/config.toml

- create:
    - ~/.zim

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [curl -fsSL -o ~/.zim/zimfw.zsh "https://github.com/zimfw/zimfw/releases/latest/download/zimfw.zsh", Downloading zimfw.zsh file]
    - [zsh ~/.zim/zimfw.zsh install, Installing modules from ~/.zimrc]
    - [command -v uv || curl -LsSf https://astral.sh/uv/install.sh | sh, Installing uv python package manager]
    - [command -v mise || curl https://mise.run | sh, Installing mise environment manager]
    - command: command -v atuin > /dev/null || curl -LsSf https://setup.atuin.sh | sh
      description: Installing atuin shell history synchronizer
      stdin: true
      stdout: true

